name: Source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: python3 scripts/generate_docs.py
      - run: git diff --exit-code -- backend/src/main/resources/static/openapi.json backend/src/main/resources/static/api-catalog.json
      - run: node --check backend/src/main/resources/static/console.js && node --check backend/src/main/resources/static/docs.js
      - run: python3 scripts/release_check.py
      - run: python3 scripts/export_source.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        module: [admin-android, reviewer-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p '${{ matrix.module }}' --no-daemon assembleDebug
